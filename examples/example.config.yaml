# An example run configuration for pbh. Every key is shown with its default value, except the grid size,
# the outer radius and the end time, which every run must state. A file may omit any key with a
# default. Floats must carry a digit on both sides of the point and after the exponent sign (1.0e-5, not 1e-5).
# The initial data are not configured here: they live in the run's initial-data file, name.initial.h5, with
# the parameters that made them. The output section arrives with the output code.

fluid:
  w: 1/3                      # the equation of state, P = w rho, as an exact rational; 1/3 is radiation

grid:
  map: sinh                   # sinh (fine at the origin, coarse in the background) or uniform
  N: 800                      # cells
  Rtilde_max: 12.0            # the outer face, in the scaled areal radius
  scale: 3.0                  # the sinh stretch's scale; omit for the uniform map

outer:
  closure: outgoing_wave      # the exact outgoing-wave condition as a penalty (paper Section 7.5), or held
  tau_u: 2.0                  # the penalty strengths; (2, 1, 0) is the production choice
  tau_rho: 1.0
  tau_W: 0.0

shocks:
  kernels: production         # the shock-capturing kernels of Section 7.7, or centred for the base scheme
  density_limiter: mc         # mc or minmod
  c_v: 1.0                    # the viscosity constant
  rho_floor: 1.0e-12          # the floor on reconstructed face densities
  viscous_flux: density_weighted  # the viscous work in the energy flux: density_weighted, or averaged (the printed face average)
  cap_tension: true           # cap the viscous tension at the fluid pressure, q >= -w rho

excision:
  eta: 0.7                    # the excision radius in units of the apparent-horizon radius at switch-on (0.7-0.8)
  tau_on: 0.3                 # the switch-on ramp time in xi (0.2-0.5)
  c_t: 4.0                    # the map's transition centre in units of the horizon label at switch-on ...
  c_Delta: 1.5                # ... and its half-width; x_t + Delta_t must stay below 0.8, checked at switch-on
  enabled: true               # false continues a collapse unexcised, to compare with the excised run
  eta_r: 0.7                  # the re-excision fraction, the face advancing as the horizon grows; null for off
  zone_extension_at: 0.8      # pin a further zone when the horizon reaches this fraction of the zone's inner edge

readout:
  window: 0.3                 # the width in xi of the line fitted to ln M_AH, whose slope is the rate omega
  spacing: 0.005              # the uniform resampling of M_AH in xi
  floor: 2.0                  # no mass is read earlier than this many e-folds after formation
  bar_span: 1.0               # the error bar takes the variation of Q over this many preceding e-folds
  target: 0.01                # the mass is read once the error bar falls below this
  stop: true                  # end the run once the mass is read; xi_end stays the latest it may run to
  efficiency_tolerance: 0.2   # flag the reading if the accretion efficiency is further than this from Michel's

stepping:
  integrator: rk4             # rk4 or ssprk3
  courant_number: 0.75
  cap_tolerance: 1.0e-5       # the step cap of eq:num:stepcap: relative error tolerance ...
  cap_efolds: 4.0             # ... over this many super-horizon e-folds

output:
  snapshot_spacing: 0.02        # snapshots every this much in xi before formation (32 KB each at N = 2000) ...
  snapshot_spacing_after: 0.02  # ... and every this much physical time, in Hubble times at formation, after it
  flush_every: 200              # steps buffered before the step record is written to disk
  monitor_every_step: false     # the full monitor record every step rather than only at snapshots (costs ~20%)

evolution:
  xi_end: 6.0                   # the run starts at the time its initial data carry
