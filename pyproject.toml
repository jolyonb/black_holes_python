[project]
name = "pbh"
version = "0.1.0"
description = "Misner-Sharp evolution of primordial black hole formation in a radiation-dominated universe"
readme = "README.md"
authors = [{ name = "Jolyon Bloomfield" }]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.25.3",
    "h5py>=3.16.0",
    "numpy>=2.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
pbh = "pbh.cli:main"

[dependency-groups]
# The build backend, in the environment because pbh is built without isolation ([tool.uv] below). A group of its own,
# and a default one, so that `uv sync --no-dev` still builds pbh; `--no-default-groups` needs `--group build`.
build = ["maturin>=1.15,<2"]
analysis = [
    "matplotlib>=3.11.1",
    "sympy>=1.14.0",
]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "scipy-stubs>=1.18.1.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
# The mixed layout: the Python packages under src/, the Rust engine's crate under rust/, built as the extension
# pbh._engine. `uv sync` (or any `uv run`) builds it; never `maturin develop`, never a copy out of rust/target.
python-source = "src"
python-packages = ["pbh", "_old"]
module-name = "pbh._engine"
manifest-path = "rust/Cargo.toml"
profile = "release"  # the editable build too: the tests and the timings run the optimised engine
exclude = ["**/__pycache__/**"]  # a wheel built outside git would otherwise pick up .pyc files

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "ANN",  # type annotations
    "D",    # pydocstyle
]
ignore = [
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "D203",  # one blank line before class docstring (conflicts with D211)
    "D213",  # multi-line summary on second line (conflicts with D212)
    "N802",  # function names: physics quantities (H, Q, P) are capitalised by convention
    "N803",  # argument names: same
    "N806",  # variable names: same
    "N815",  # mixed-case attributes: same
    "SIM300",  # "Yoda conditions": a capitalised physics name (H, E, U, M, W) is not a constant
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingModuleSource = false
reportConstantRedefinition = false  # physics quantities (Q, P, H) are capitalised by convention
reportMissingTypeStubs = false  # h5py ships no stubs; pbh.h5 is the one typed shim over it

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: full evolutions taking around a second each; run with `pytest -m slow` or `pytest -m ''`"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pbh"]

[tool.coverage.report]
fail_under = 100  # every line of the production code is exercised by the fast suite; pre-commit enforces it
exclude_also = [
    'if __name__ == "__main__":',  # exercised by a subprocess test, invisible to the in-process report
    "if TYPE_CHECKING:",  # imports for the type checker only
]
show_missing = true
skip_covered = false

[tool.uv]
# The first uv that reads [tool.uv.extra-build-variables] below. An older uv cannot parse this table and ignores all of
# it with a warning, this line included, so the README states the minimum as well.
required-version = ">=0.8.6"
default-groups = ["build", "dev", "analysis"]
# Build pbh in the project's environment, with the build group's maturin, not in a fresh isolated one. An isolated build
# runs from a new temporary directory each time, and maturin hands that interpreter's path to PyO3's build script, so
# cargo would recompile pyo3 and numpy on every edit of the engine (about 6 s instead of 3). uv installs maturin first
# on a fresh environment; `uv build` of a wheel is unaffected.
no-build-isolation-package = ["pbh"]
# What makes uv rebuild the project: the Rust sources as well as the Python metadata, so that `uv run pytest` always
# tests the current engine.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
]

[tool.uv.extra-build-variables]
# Without a Rust toolchain maturin would download one (about 500 MB) during `uv sync`; fail at once instead.
pbh = { MATURIN_NO_INSTALL_RUST = "1" }
