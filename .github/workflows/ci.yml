name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # astral publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Runs ruff, pyright and the fast test suite, exactly as the git hook does locally
      - run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
      - run: uv run --frozen pytest -m slow
